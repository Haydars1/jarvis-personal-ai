name: hayirlievlad
options:
  bundleIdPrefix: com.hayirlievlad
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  HayirlievladShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: hayırlıevlad
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hayirlievlad.app.share
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: ShareExtension/HayirlievladShare.entitlements
  Hayirlievlad:
    type: application
    platform: iOS
    sources:
      - path: Hayirlievlad
    info:
      path: Hayirlievlad/Info.plist
      properties:
        CFBundleDisplayName: hayırlıevlad
        CFBundleURLTypes:
          - CFBundleURLName: com.hayirlievlad.app
            CFBundleURLSchemes:
              - hayirlievlad
        NSMicrophoneUsageDescription: "hayırlıevlad ile sesli konuşmak için mikrofon kullanılır."
        NSBluetoothAlwaysUsageDescription: "hayırlıevlad OBD cihazını bulmak ve seçtiğin cihaza Bluetooth ile bağlanmak için erişim kullanır."
        NSSpeechRecognitionUsageDescription: "hayırlıevlad konuşmanı yazıya çevirmek için konuşma tanımayı kullanır."
        NSCameraUsageDescription: "hayırlıevlad'a fotoğraf göstermek için kamera kullanılır."
        NSPhotoLibraryUsageDescription: "hayırlıevlad'a fotoğraf ve video göndermek için fotoğraf arşivine erişilir."
        NSLocationWhenInUseUsageDescription: "hayırlıevlad yakındaki yerleri, rota ve konuma bağlı cevapları doğru verebilmek için konumunu kullanır."
        NSFaceIDUsageDescription: "hayırlıevlad parolanı tekrar yazmadan güvenli giriş yapmak için Face ID kullanır."
        NSCalendarsFullAccessUsageDescription: "hayırlıevlad takvimini okuyup randevu ve etkinliklerini yönetmek için tam takvim erişimi kullanır."
        NSRemindersFullAccessUsageDescription: "hayırlıevlad hatırlatıcılarını okuyup oluşturmak ve yönetmek için erişim kullanır."
        NSAlarmKitUsageDescription: "hayırlıevlad istediğin zamanlarda gerçek alarm ve zamanlayıcı kurmak için AlarmKit kullanır."
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIBackgroundModes:
          - remote-notification
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSSupportsGameMode: false
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hayirlievlad.app
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Hayirlievlad/Hayirlievlad.entitlements
    dependencies:
      - target: HayirlievladShare
