name: JARVIS
options:
  bundleIdPrefix: com.haydojarvis
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  JARVIS:
    type: application
    platform: iOS
    sources:
      - path: JARVIS
    info:
      path: JARVIS/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haydojarvis.jarvis
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: JARVIS/JARVIS.entitlements
    dependencies: []
  JARVISShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haydojarvis.jarvis.share
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: ShareExtension/JARVISShare.entitlements
    dependencies:
      - target: JARVIS
