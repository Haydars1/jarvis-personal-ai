name: JARVIS
options:
  bundleIdPrefix: com.haydojarvis
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  JARVISShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).ShareViewController"
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haydojarvis.jarvis.share
        CODE_SIGN_STYLE: Automatic
    entitlements:
      path: ShareExtension/JARVISShare.entitlements
  JARVIS:
    type: application
    platform: iOS
    sources:
      - path: JARVIS
    info:
      path: JARVIS/Info.plist
      properties:
        CFBundleDisplayName: JARVIS
        CFBundleURLTypes:
          - CFBundleURLName: com.haydojarvis.jarvis
            CFBundleURLSchemes:
              - jarvis
        NSMicrophoneUsageDescription: "JARVIS ile sesli konuşmak için mikrofon kullanılır."
        NSSpeechRecognitionUsageDescription: "JARVIS konuşmanı yazıya çevirmek için konuşma tanımayı kullanır."
        NSCameraUsageDescription: "JARVIS'e fotoğraf göstermek için kamera kullanılır."
        NSPhotoLibraryUsageDescription: "JARVIS'e fotoğraf ve video göndermek için fotoğraf arşivine erişilir."
        NSLocationWhenInUseUsageDescription: "JARVIS yakındaki yerleri, rota ve konuma bağlı cevapları doğru verebilmek için konumunu kullanır."
        NSCalendarsFullAccessUsageDescription: "JARVIS takvimini okuyup randevu ve etkinliklerini yönetmek için tam takvim erişimi kullanır."
        NSRemindersFullAccessUsageDescription: "JARVIS hatırlatıcılarını okuyup oluşturmak ve yönetmek için erişim kullanır."
        NSAlarmKitUsageDescription: "JARVIS istediğin zamanlarda gerçek alarm ve zamanlayıcı kurmak için AlarmKit kullanır."
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIBackgroundModes:
          - remote-notification
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        LSSupportsGameMode: false
        LSApplicationCategoryType: public.app-category.utilities
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haydojarvis.jarvis
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
    entitlements:
      path: JARVIS/JARVIS.entitlements
    dependencies:
      - target: JARVISShare
