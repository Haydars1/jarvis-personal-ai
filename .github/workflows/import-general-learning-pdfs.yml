name: Import general education PDF

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Verify existing learning schema in remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute jarvis-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('learning_sources','learning_chunks','ecu_manual_library_documents','ecu_manual_library_passages') ORDER BY name;" --json > /tmp/learning-schema.json
          node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("/tmp/learning-schema.json","utf8")); const names=new Set(d.flatMap(x=>x.results??[]).map(x=>x.name)); const required=["learning_sources","learning_chunks","ecu_manual_library_documents","ecu_manual_library_passages"]; const missing=required.filter(x=>!names.has(x)); if(missing.length){console.error("Missing live D1 tables:",missing.join(", ")); process.exit(1)} console.log("All required tables exist");'
      - name: Download and extract verified OpenStax PDF
        run: node scripts/import-general-learning-pdfs.mjs
      - name: Import into existing Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx wrangler d1 execute jarvis-db --remote --file=.wrangler/general-pdf-import.sql
          npx wrangler d1 execute jarvis-db --remote --command "SELECT COUNT(*) AS general_pdf_count FROM ecu_manual_library_documents WHERE tags_json LIKE '%general-education%';"
