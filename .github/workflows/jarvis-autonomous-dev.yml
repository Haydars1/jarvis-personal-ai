name: JARVIS Autonomous Dev Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '7 * * * *'

permissions:
  contents: write

concurrency:
  group: jarvis-autonomous-dev-feature-learning-engine
  cancel-in-progress: false

jobs:
  develop:
    if: github.repository == 'Haydars1/jarvis-personal-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v5
        with:
          ref: feature/learning-engine
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Write autonomous coding prompt
        shell: bash
        run: |
          cat > /tmp/jarvis-dev-prompt.txt <<'EOF'
          Work only in this checked-out repository and only toward branch feature/learning-engine.
          Continue JARVIS development autonomously for this run. Inspect implementation, tests, git history and current working tree.
          Read src/lib/capability-policy.js and prioritize concrete missing capability implementations, regressions and integrations.
          Prioritize conversation/task continuity, persistent learning context, provider routing/failover, social/video automation,
          ECU diagnostics/file-analysis infrastructure, safe device-bridge architecture, reliability, observability, tests, performance,
          UX and maintainability. Do not stop after one tiny change when another independent safe improvement can be completed.
          For each gap define an acceptance condition, make the smallest reversible fix, and add/update tests where practical.
          Never modify secrets, credentials, production deployment configuration, branch protections or security gates.
          Never deploy production, merge main, force-push, delete data, spend money or make irreversible external changes.
          Do not implement emissions-control defeat patches or automated road-vehicle emissions bypasses.
          Finish with npm run check passing and leave verified changes in the working tree. Do not commit or push.
          EOF

      - name: Run Codex coding agent
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          prompt: |
            Follow /tmp/jarvis-dev-prompt.txt conceptually: work only in this repository on feature/learning-engine.
            Inspect src/lib/capability-policy.js, implement useful missing capability work, test it, and leave verified changes uncommitted.

      - name: Reset failed Codex work
        if: ${{ steps.codex.outcome != 'success' }}
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Install OpenCode multi-provider fallback
        if: ${{ steps.codex.outcome != 'success' }}
        run: npm install --global @opencode/cli

      - name: Run best available coding provider
        id: multiprovider
        if: ${{ steps.codex.outcome != 'success' }}
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bash .github/scripts/run-coding-provider-fallback.sh /tmp/jarvis-dev-prompt.txt

      - name: Require a coding agent to succeed
        if: ${{ steps.codex.outcome != 'success' && steps.multiprovider.outcome != 'success' }}
        run: exit 1

      - name: Verify full test suite
        run: npm run check

      - name: Commit validated changes to feature branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo "No repository changes produced."
            exit 0
          fi
          git config user.name "jarvis-dev-agent"
          git config user.email "jarvis-dev-agent@users.noreply.github.com"
          git add -A
          git commit -m "chore(agent): autonomous JARVIS development"
          gh auth setup-git
          git push origin HEAD:feature/learning-engine
