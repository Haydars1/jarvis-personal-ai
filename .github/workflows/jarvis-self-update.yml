name: JARVIS Self Update Validation
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  validate-only:
    if: startsWith(github.head_ref, 'jarvis/') || startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Full checks
        run: npm run check
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry
      - name: Preserve tested PR for explicit review
        run: echo "Validation passed. Merge to main remains an explicit user-controlled action."
