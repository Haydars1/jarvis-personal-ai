name: Check Cloudflare Trust Safety Report State (read-only)
on:
  push:
    branches:
      - diagnostics/trust-safety-20261017
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read report mitigation status only; do not expose complaint details
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const id=process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const base='https://api.cloudflare.com/client/v4/accounts/'+id+'/abuse-reports';
          for (const [name,url] of [
            ['report',base+'/cc12ec1939a4b1d6'],
            ['mitigations',base+'/cc12ec1939a4b1d6/mitigations']
          ]) {
            try{
              const r=await fetch(url,{headers,signal:AbortSignal.timeout(15000)});
              const obj=await r.json(), data=obj.result||{};
              console.log(JSON.stringify({name,http:r.status,success:obj.success,error_codes:(obj.errors||[]).map(e=>e.code),status:data.status,type:data.type,summary:data.mitigation_summary,mitigations:(data.mitigations||[]).map(m=>({type:m.type,status:m.status,entity_type:m.entity_type,effective_date:m.effective_date})).slice(0,15)}));
            }catch(e){console.log(name,'request_failed',e.name)}
          }
          NODE
