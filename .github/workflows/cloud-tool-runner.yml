name: JARVIS Cloud Tool Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/cloud-tool-runner.mjs'
      - '.github/scripts/code-graph-job.mjs'
      - 'src/application/capabilities/**'
      - 'src/application/code-graph/**'
      - 'src/lib/code-graph.js'
      - 'src/lib/repo-skill-compiler.js'
      - 'src/lib/skill-learning.js'
      - 'src/lib/native-skill-adapters.js'
      - 'src/lib/youtube-teaching-runtime.js'
      - 'scripts/code-graph/**'
      - 'docs/releases/**'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  id-token: write
  contents: read

concurrency:
  group: jarvis-cloud-tool-runner
  cancel-in-progress: false

jobs:
  run-one:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout JARVIS runner code
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JARVIS dependencies
        run: npm install --no-audit --no-fund

      - name: Install YouTube media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python3 -m pip install --user --disable-pip-version-check yt-dlp
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/yt-dlp" --version
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | sed -n '1p'
          ffprobe -version | sed -n '1p'

      - name: Run queued cloud capability batch
        env:
          JARVIS_URL: https://jarvis-personal-ai.haydojarvis.workers.dev
          PATH: /home/runner/.local/bin:/usr/local/bin:/usr/bin:/bin
        run: node .github/scripts/cloud-tool-runner.mjs
