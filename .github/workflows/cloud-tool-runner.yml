name: JARVIS Cloud Tool Runner

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/cloud-tool-runner.mjs'
      - 'src/application/capabilities/**'
      - 'src/lib/repo-skill-compiler.js'
      - 'src/lib/skill-learning.js'
      - 'src/lib/native-skill-adapters.js'
      - 'docs/releases/**'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  id-token: write
  contents: read

concurrency:
  group: jarvis-cloud-tool-runner
  cancel-in-progress: false

jobs:
  run-one:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout JARVIS runner code
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run queued cloud capability batch
        env:
          JARVIS_URL: https://haydojarvis.workers.dev
        run: node .github/scripts/cloud-tool-runner.mjs
