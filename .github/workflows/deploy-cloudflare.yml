name: Deploy JARVIS to Cloudflare
on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/jarvis-autonomous-dev.yml'
      - '.github/workflows/jarvis-codex-agent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Validate runtime syntax
        run: npm run check
      - name: Apply additive D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute jarvis-db --remote --file=./schema.sql
          npx wrangler d1 execute jarvis-db --remote --file=./migrations/2026-10-03-youtube-learning.sql
      - name: Audit configured AI providers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute jarvis-db --remote --command "SELECT provider,label,kind,capabilities,model,priority,enabled,last_status,last_error,last_test_at FROM credentials ORDER BY enabled DESC,priority ASC,created_at ASC;"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Production HTTP and session checks
        id: health
        continue-on-error: true
        env:
          HEALTH_URL: ${{ secrets.JARVIS_HEALTH_URL }}
        run: node scripts/production-smoke.mjs
      - name: Roll back failed deployment
        if: steps.health.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler rollback --message "Automatic rollback: production HTTP or session check failed"
          exit 1

# deploy-trigger: 2026-10-03 persistent-youtube-learning
