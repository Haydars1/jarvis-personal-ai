name: Deploy JARVIS to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Validate runtime syntax
        run: npm run check
      - name: Apply additive D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute jarvis-db --remote --file=./schema.sql
      - name: Audit configured AI providers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute jarvis-db --remote --command "SELECT provider,label,kind,capabilities,model,priority,enabled,last_status,last_error,last_test_at FROM credentials ORDER BY enabled DESC,priority ASC,created_at ASC;"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Live health check
        id: health
        continue-on-error: true
        env:
          HEALTH_URL: ${{ secrets.JARVIS_HEALTH_URL }}
        run: |
          test -n "$HEALTH_URL"
          for i in 1 2 3 4 5; do
            curl --fail --silent --show-error "$HEALTH_URL" && exit 0
            sleep 8
          done
          exit 1
      - name: Roll back failed deployment
        if: steps.health.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler rollback --message "Automatic rollback: health check failed"
          exit 1
