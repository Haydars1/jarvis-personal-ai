name: Deploy JARVIS to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Validate runtime syntax
        run: npm run check
      - name: Configure ECU compute secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ECU_COMPUTE_TOKEN: ${{ secrets.ECU_COMPUTE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$ECU_COMPUTE_TOKEN"
          printf '%s' "$ECU_COMPUTE_TOKEN" | npx wrangler secret put ECU_COMPUTE_TOKEN
      - name: Ensure ECU artifact bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BUCKETS="$(npx wrangler r2 bucket list --json)"
          if ! node -e 'const xs=JSON.parse(process.argv[1]); if(!xs.some(x => x.name === "jarvis-ecu-artifacts")) process.exit(1)' "$BUCKETS"; then
            npx wrangler r2 bucket create jarvis-ecu-artifacts
          fi
      - name: Apply additive D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute jarvis-db --remote --file=./schema.sql
          npx wrangler d1 execute jarvis-db --remote --file=./schema-ecu.sql
      - name: Audit configured AI providers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute jarvis-db --remote --command "SELECT provider,label,kind,capabilities,model,priority,enabled,last_status,last_error,last_test_at FROM credentials ORDER BY enabled DESC,priority ASC,created_at ASC;"
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Production chat smoke check
        id: health
        continue-on-error: true
        env:
          HEALTH_URL: ${{ secrets.JARVIS_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$HEALTH_URL"
          BASE_URL="${HEALTH_URL%/}"
          BASE_URL="${BASE_URL%/api/health}"
          BASE_URL="${BASE_URL%/health}"
          CHAT_URL="$BASE_URL/api/chat/send"
          echo "Testing production chat endpoint: $CHAT_URL"
          for i in 1 2 3; do
            BODY=$(curl --fail --silent --show-error --max-time 35 \
              -H 'content-type: application/json' \
              -d '{"text":"Merhaba. Sadece TAMAM yaz."}' \
              "$CHAT_URL" || true)
            echo "$BODY"
            if node -e 'const p=JSON.parse(process.argv[1]); const r=String(p.reply||"").trim(); if(!r || r.startsWith("JARVIS şu an yanıt üretemedi")) process.exit(1)' "$BODY"; then
              echo "Production chat smoke check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Production chat smoke check failed: chat did not produce a real reply"
          exit 1
      - name: Roll back failed deployment
        if: steps.health.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler rollback --message "Automatic rollback: production chat smoke check failed"
          exit 1
