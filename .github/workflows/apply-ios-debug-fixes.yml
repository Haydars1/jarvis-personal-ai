name: Apply bounded iOS diagnostic status fixes

on:
  push:
    branches:
      - feature/learning-engine
    paths:
      - '.github/workflows/apply-ios-debug-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/learning-engine
          fetch-depth: 0

      - name: Apply exact source patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected source block not found: {path}: {old[:60]!r}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'ios/JARVIS/ThinkDiagBluetooth.swift',
              '''    var transportNotice: String {
                  if preferredServiceDetected {
                      return "Launch/ThinkDiag BLE servis imzası bulundu. JARVIS bildirimleri dinliyor ve bilinen VCI çerçeve yapısını pasif olarak çözüyor."
                  }
                  return "Bluetooth bağlantısı kuruldu. JARVIS servis/karakteristikleri keşfediyor; FFF0 veya ISSC imzası bulunursa ThinkDiag VCI modu otomatik seçilir."
              }
          ''',
              '''    var transportNotice: String {
                  switch state {
                  case .idle:
                      return "ThinkDiag bağlı değil. Bağlanmak için Bluetooth Tara'ya dokun."
                  case .scanning:
                      return "Bluetooth cihazları aranıyor…"
                  case .connecting(let name):
                      return "\\(name) bağlantısı kuruluyor…"
                  case .connected:
                      if preferredServiceDetected {
                          return "Launch/ThinkDiag BLE servis imzası bulundu. JARVIS bildirimleri dinliyor ve bilinen VCI çerçeve yapısını pasif olarak çözüyor."
                      }
                      return "Bluetooth bağlantısı kuruldu. JARVIS servis/karakteristikleri keşfediyor; FFF0 veya ISSC imzası bulunursa ThinkDiag VCI modu otomatik seçilir."
                  case .disconnected:
                      return "ThinkDiag bağlantısı kesildi."
                  case .failed(let message):
                      return "Bluetooth kullanılamıyor: \\(message)"
                  }
              }
          ''')

          p = Path('ios/JARVIS/DiagnosticView.swift')
          text = p.read_text()
          pattern = re.compile(r'(VehicleRuntimeCapabilities\.list\(\n\s*online: networkMonitor\.isOnline,\n)(\s*)(brand: effectiveBrand,)')
          text, count = pattern.subn(
              lambda m: m.group(1) + m.group(2) + 'transportReady: bluetooth.isThinkDiagTransportReady,\n' + m.group(2) + 'protocolConfirmed: bluetooth.protocolProfile != nil,\n' + m.group(2) + m.group(3),
              text,
              count=1
          )
          if count != 1:
              raise SystemExit(f'vehicle runtime call patch count={count}')

          old_date = 'Text("Son offline katalog güncellemesi: \\(lastRefresh.formatted(date: .abbreviated, time: .shortened))")'
          new_date = 'Text("Son offline katalog güncellemesi: \\(JarvisTurkishFormatting.dateTime.string(from: lastRefresh))")'
          if old_date not in text:
              raise SystemExit('offline catalog date line not found')
          text = text.replace(old_date, new_date, 1)
          p.write_text(text)

          Path('ios/JARVIS/JarvisTurkishFormatting.swift').write_text('''import Foundation

          enum JarvisTurkishFormatting {
              static let dateTime: DateFormatter = {
                  let formatter = DateFormatter()
                  formatter.locale = Locale(identifier: "tr_TR")
                  formatter.dateStyle = .medium
                  formatter.timeStyle = .short
                  return formatter
              }()
          }
          ''')
          PY

          git diff --check

      - name: Commit bounded fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/JARVIS/ThinkDiagBluetooth.swift ios/JARVIS/DiagnosticView.swift ios/JARVIS/JarvisTurkishFormatting.swift
          git rm .github/workflows/apply-ios-debug-fixes.yml
          git commit -m "fix: make native diagnostic status truthful"
          git push origin HEAD:feature/learning-engine
