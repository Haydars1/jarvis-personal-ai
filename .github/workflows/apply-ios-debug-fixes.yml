name: Apply bounded iOS diagnostic status fixes

on:
  push:
    branches:
      - feature/learning-engine
    paths:
      - '.github/workflows/apply-ios-debug-fixes.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/learning-engine
          fetch-depth: 0

      - name: Apply exact source patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected source block not found: {path}")
              p.write_text(text.replace(old, new, 1))

          replace(
              'ios/JARVIS/ThinkDiagBluetooth.swift',
              '''    var transportNotice: String {
                  if preferredServiceDetected {
                      return "Launch/ThinkDiag BLE servis imzası bulundu. JARVIS bildirimleri dinliyor ve bilinen VCI çerçeve yapısını pasif olarak çözüyor."
                  }
                  return "Bluetooth bağlantısı kuruldu. JARVIS servis/karakteristikleri keşfediyor; FFF0 veya ISSC imzası bulunursa ThinkDiag VCI modu otomatik seçilir."
              }
          ''',
              '''    var transportNotice: String {
                  switch state {
                  case .idle:
                      return "ThinkDiag bağlı değil. Bağlanmak için Bluetooth Tara'ya dokun."
                  case .scanning:
                      return "Bluetooth cihazları aranıyor…"
                  case .connecting(let name):
                      return "\\(name) bağlantısı kuruluyor…"
                  case .connected:
                      if preferredServiceDetected {
                          return "Launch/ThinkDiag BLE servis imzası bulundu. JARVIS bildirimleri dinliyor ve bilinen VCI çerçeve yapısını pasif olarak çözüyor."
                      }
                      return "Bluetooth bağlantısı kuruldu. JARVIS servis/karakteristikleri keşfediyor; FFF0 veya ISSC imzası bulunursa ThinkDiag VCI modu otomatik seçilir."
                  case .disconnected:
                      return "ThinkDiag bağlantısı kesildi."
                  case .failed(let message):
                      return "Bluetooth kullanılamıyor: \\(message)"
                  }
              }
          ''')

          replace(
              'ios/JARVIS/VehicleNetworkMonitor.swift',
              '''    static func list(
                  online: Bool,
                  brand: VehicleBrand,
                  hasManufacturerPack: Bool,
                  hasCodingCache: Bool
              ) -> [VehicleRuntimeCapability] {
                  [
                      .init(
                          name: "Hata kodu okuma",
                          available: true,
                          tier: .local,
                          detail: "ThinkDiag ↔ araç Bluetooth bağlantısı; internet gerekmez."
                      ),
                      .init(
                          name: "Genel OBD canlı veri",
                          available: true,
                          tier: .local,
                          detail: "RPM, MAP, MAF, sıcaklık, hız ve desteklenen PID'ler yerel çalışır."
                      ),
                      .init(
                          name: "Yerel DTC açıklaması",
                          available: true,
                          tier: .local,
                          detail: "Uygulama içindeki DTC veritabanından çalışır."
                      ),
                      .init(
                          name: "Üretici modül taraması",
                          available: hasManufacturerPack,
                          tier: hasManufacturerPack ? .cached : .onlineEnhanced,
                          detail: hasManufacturerPack
                              ? "\\(brand.rawValue) teşhis paketi telefonda mevcut."
                              : "Bu marka için üretici paketi önce çevrimiçiyken indirilmelidir."
                      ),
                      .init(
                          name: "Kodlama / gizli özellikler",
                          available: hasCodingCache || online,
                          tier: hasCodingCache ? .cached : .onlineEnhanced,
                          detail: hasCodingCache
                              ? "Daha önce indirilen doğrulanmış reçeteler internet olmadan kullanılabilir."
                              : "Yeni reçete/katalog için internet gerekir."
                      ),
                      .init(
                          name: "AI teşhis yorumu",
                          available: online,
                          tier: .onlineEnhanced,
                          detail: online
                              ? "Yerel teşhisin üstüne ek yorum yapabilir."
                              : "İnternet yok; yerel açıklama kullanılacak."
                      )
                  ]
              }
          ''',
              '''    static func list(
                  online: Bool,
                  transportReady: Bool,
                  protocolConfirmed: Bool,
                  brand: VehicleBrand,
                  hasManufacturerPack: Bool,
                  hasCodingCache: Bool
              ) -> [VehicleRuntimeCapability] {
                  let genericReady = transportReady && protocolConfirmed
                  let manufacturerReady = genericReady && hasManufacturerPack
                  let codingReady = genericReady && hasCodingCache

                  return [
                      .init(
                          name: "Hata kodu okuma",
                          available: genericReady,
                          tier: .local,
                          detail: !transportReady
                              ? "ThinkDiag bağlı değil."
                              : (protocolConfirmed ? "ThinkDiag ↔ araç OBD bağlantısı doğrulandı; internet gerekmez." : "ThinkDiag bağlı; OBD protokolü henüz doğrulanmadı.")
                      ),
                      .init(
                          name: "Genel OBD canlı veri",
                          available: genericReady,
                          tier: .local,
                          detail: !transportReady
                              ? "ThinkDiag bağlı değil."
                              : (protocolConfirmed ? "RPM, MAP, MAF, sıcaklık, hız ve desteklenen PID'ler yerel çalışır." : "Canlı veri için OBD protokolünün doğrulanması gerekiyor.")
                      ),
                      .init(
                          name: "Yerel DTC açıklaması",
                          available: true,
                          tier: .local,
                          detail: "Okunan veya içe aktarılan DTC'ler uygulama içindeki veritabanından açıklanır."
                      ),
                      .init(
                          name: "Üretici modül taraması",
                          available: manufacturerReady,
                          tier: hasManufacturerPack ? .cached : .onlineEnhanced,
                          detail: !transportReady
                              ? "Önce ThinkDiag bağlantısını kur."
                              : (!protocolConfirmed
                                  ? "Önce OBD protokolünü doğrula."
                                  : (hasManufacturerPack ? "\\(brand.rawValue) teşhis paketi telefonda mevcut." : "Bu marka için üretici paketi önce çevrimiçiyken indirilmelidir."))
                      ),
                      .init(
                          name: "Kodlama / gizli özellikler",
                          available: codingReady,
                          tier: hasCodingCache ? .cached : .onlineEnhanced,
                          detail: !transportReady
                              ? "Önce ThinkDiag bağlantısını kur."
                              : (!protocolConfirmed
                                  ? "Önce araç protokolünü doğrula."
                                  : (hasCodingCache ? "Doğrulanmış reçeteler telefonda mevcut." : (online ? "İnternet var; ancak doğrulanmış kodlama reçetesi henüz telefonda yok." : "Doğrulanmış kodlama reçetesi telefonda yok.")))
                      ),
                      .init(
                          name: "AI teşhis yorumu",
                          available: online,
                          tier: .onlineEnhanced,
                          detail: online
                              ? "Yerel teşhisin üstüne ek yorum yapabilir."
                              : "İnternet yok; yerel açıklama kullanılacak."
                      )
                  ]
              }
          ''')

          replace(
              'ios/JARVIS/DiagnosticView.swift',
              '''        VehicleRuntimeCapabilities.list(
                  online: networkMonitor.isOnline,
                  brand: effectiveBrand,
                  hasManufacturerPack: ManufacturerDiagnosticRegistry.shared.pack(for: effectiveBrand) != nil,
                  hasCodingCache: OfflineVehicleDataStore.hasCodingResearch(brand: effectiveBrand)
              )''',
              '''        VehicleRuntimeCapabilities.list(
                  online: networkMonitor.isOnline,
                  transportReady: bluetooth.isThinkDiagTransportReady,
                  protocolConfirmed: bluetooth.protocolProfile != nil,
                  brand: effectiveBrand,
                  hasManufacturerPack: ManufacturerDiagnosticRegistry.shared.pack(for: effectiveBrand) != nil,
                  hasCodingCache: OfflineVehicleDataStore.hasCodingResearch(brand: effectiveBrand)
              )''')

          replace(
              'ios/JARVIS/DiagnosticView.swift',
              '''Text("Son offline katalog güncellemesi: \\(lastRefresh.formatted(date: .abbreviated, time: .shortened))")''',
              '''Text("Son offline katalog güncellemesi: \\(JarvisTurkishFormatting.dateTime.string(from: lastRefresh))")''')

          Path('ios/JARVIS/JarvisTurkishFormatting.swift').write_text('''import Foundation

          enum JarvisTurkishFormatting {
              static let dateTime: DateFormatter = {
                  let formatter = DateFormatter()
                  formatter.locale = Locale(identifier: "tr_TR")
                  formatter.dateStyle = .medium
                  formatter.timeStyle = .short
                  return formatter
              }()
          }
          ''')
          PY

          git diff --check

      - name: Commit bounded fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/JARVIS/ThinkDiagBluetooth.swift ios/JARVIS/VehicleNetworkMonitor.swift ios/JARVIS/DiagnosticView.swift ios/JARVIS/JarvisTurkishFormatting.swift
          git rm .github/workflows/apply-ios-debug-fixes.yml
          git commit -m "fix: make native diagnostic status truthful"
          git push origin HEAD:feature/learning-engine
