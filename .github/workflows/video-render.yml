name: JARVIS Video Render
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Video job ID'
        required: true

env:
  JARVIS_URL: https://jarvis-personal-ai.haydojarvis.workers.dev

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg imagemagick
          pip install edge-tts Pillow

      - name: Fetch job
        run: |
          curl -s "$JARVIS_URL/api/video/job?id=${{ inputs.job_id }}" -o job.json
          cat job.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Platform: {d.get(\"platform\",\"?\")}'); print(f'Images: {len(d.get(\"imageUrls\",[]))}'); print(f'Topic: {d.get(\"topic\",\"\")}'); print(f'Narration: {len(d.get(\"narration\",\"\"))} chars'); print(f'Voice: {d.get(\"voice\",\"tr-TR-AhmetNeural\")}'); print(f'Subtitles: {d.get(\"subtitles\",False)}'); print(f'Music: {d.get(\"music\",\"none\")}')"

      - name: Download images
        run: |
          mkdir -p frames
          python3 << 'PY'
          import json, urllib.request, os
          job = json.load(open('job.json'))
          base = os.environ['JARVIS_URL']
          for i, url in enumerate(job.get('imageUrls', [])):
              full = url if url.startswith('http') else base + url
              out = f'frames/img_{i:03d}.png'
              urllib.request.urlretrieve(full, out)
              print(f'  Downloaded {out}')
          PY

      - name: Generate TTS narration
        run: |
          python3 << 'PY'
          import json, subprocess
          job = json.load(open('job.json'))
          narration = job.get('narration', '')
          voice = job.get('voice', 'tr-TR-AhmetNeural')
          if narration:
              subprocess.run([
                  'edge-tts', '--voice', voice,
                  '--text', narration,
                  '--write-media', 'narration.mp3',
                  '--write-subtitles', 'narration.vtt'
              ], check=True)
              print('TTS done')
          else:
              print('No narration, skipping TTS')
          PY

      - name: Add text overlays to images
        run: |
          python3 << 'PY'
          import json, os, glob
          from PIL import Image, ImageDraw, ImageFont
          
          job = json.load(open('job.json'))
          overlays = job.get('textOverlays', [])
          
          frames = sorted(glob.glob('frames/img_*.png'))
          for i, frame_path in enumerate(frames):
              if i < len(overlays) and overlays[i]:
                  img = Image.open(frame_path)
                  draw = ImageDraw.Draw(img)
                  text = overlays[i].get('text', '')
                  if text:
                      # Auto font size
                      w, h = img.size
                      font_size = min(w // 12, 80)
                      try:
                          font = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', font_size)
                      except:
                          font = ImageFont.load_default()
                      
                      # Text background
                      bbox = draw.textbbox((0, 0), text, font=font)
                      tw, th = bbox[2] - bbox[0], bbox[3] - bbox[1]
                      pos = overlays[i].get('position', 'bottom')
                      if pos == 'top':
                          y = h * 0.08
                      elif pos == 'center':
                          y = (h - th) / 2
                      else:
                          y = h * 0.82
                      x = (w - tw) / 2
                      
                      # Semi-transparent background
                      padding = 16
                      draw.rectangle([x-padding, y-padding, x+tw+padding, y+th+padding], fill=(0,0,0,180))
                      draw.text((x, y), text, fill='white', font=font)
                      img.save(frame_path)
                      print(f'  Overlay on {frame_path}: {text[:40]}')
          PY

      - name: Render video with FFmpeg
        run: |
          python3 << 'PY'
          import json, subprocess, os, glob
          
          job = json.load(open('job.json'))
          spec = job.get('spec', {})
          w = spec.get('width', 1080)
          h = spec.get('height', 1920)
          fps = spec.get('fps', 30)
          per_img = job.get('perImageSec', 3)
          max_dur = min(spec.get('maxDuration', 60), 60)
          
          frames = sorted(glob.glob('frames/img_*.png'))
          if not frames:
              print('No frames!'); exit(1)
          
          # Ken Burns effect — slow zoom + pan on each image
          filter_parts = []
          for i, f in enumerate(frames):
              # Slight zoom from 1.0 to 1.08 over duration
              filter_parts.append(
                  f"[{i}:v]scale={w*2}:{h*2},zoompan=z='min(zoom+0.0008,1.08)':x='iw/2-(iw/zoom/2)':y='ih/2-(ih/zoom/2)':d={per_img*fps}:s={w}x{h}:fps={fps}[v{i}]"
              )
          
          inputs = ' '.join(f'-loop 1 -t {per_img} -i {f}' for f in frames)
          filter_str = ';'.join(filter_parts)
          concat = ''.join(f'[v{i}]' for i in range(len(frames)))
          filter_str += f';{concat}concat=n={len(frames)}:v=1:a=0[outv]'
          
          # Audio
          has_narration = os.path.exists('narration.mp3')
          has_subtitles = os.path.exists('narration.vtt')
          
          cmd = f'ffmpeg {inputs}'
          if has_narration:
              cmd += ' -i narration.mp3'
          
          cmd += f' -filter_complex "{filter_str}"'
          cmd += f' -map "[outv]"'
          
          if has_narration:
              cmd += f' -map {len(frames)}:a -c:a aac -b:a 128k -shortest'
          else:
              cmd += ' -an'
          
          # Burn subtitles if available
          if has_subtitles and job.get('subtitles', False):
              # Re-encode with subtitles burned in
              cmd += f' -vf "subtitles=narration.vtt:force_style=\'FontSize=24,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,Outline=2,Bold=1\'"'
          
          cmd += f' -c:v libx264 -preset fast -crf 23 -pix_fmt yuv420p -t {max_dur} output.mp4'
          
          print(f'Running: {cmd[:200]}...')
          subprocess.run(cmd, shell=True, check=True)
          
          size = os.path.getsize('output.mp4')
          print(f'Output: {size} bytes ({size/1024/1024:.1f} MB)')
          PY

      - name: Upload to JARVIS
        run: |
          # Base64 encode and upload
          python3 << 'PY'
          import base64, json, urllib.request
          
          with open('output.mp4', 'rb') as f:
              b64 = base64.b64encode(f.read()).decode()
          
          data = json.dumps({'jobId': '${{ inputs.job_id }}', 'videoBase64': b64}).encode()
          req = urllib.request.Request(
              f'{os.environ["JARVIS_URL"]}/api/video/complete',
              data=data,
              headers={'Content-Type': 'application/json'}
          )
          import os
          req = urllib.request.Request(
              f'https://jarvis-personal-ai.haydojarvis.workers.dev/api/video/complete',
              data=data,
              headers={'Content-Type': 'application/json'}
          )
          resp = urllib.request.urlopen(req)
          result = json.loads(resp.read())
          print(f'Upload result: {json.dumps(result)}')
          PY
