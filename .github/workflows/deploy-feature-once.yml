name: Deploy Feature JARVIS Once

on:
  push:
    branches: [feature/learning-engine]
    paths:
      - .github/workflows/deploy-feature-once.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/learning-engine
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Validate
        run: npm run check
      - name: Apply D1 schema and migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute jarvis-db --remote --file=./schema.sql
          npx wrangler d1 migrations apply jarvis-db --remote
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke check
        run: |
          node - <<'NODE'
          const r=await fetch('https://jarvis-personal-ai.haydojarvis.workers.dev/api/version');
          if(!r.ok) throw new Error('smoke '+r.status);
          console.log(await r.text());
          NODE
