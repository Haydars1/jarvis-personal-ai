name: Deploy Feature JARVIS Once

on:
  push:
    branches: [feature/learning-engine]
    paths:
      - .github/workflows/deploy-feature-once.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/learning-engine
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Validate
        run: npm run check
      - name: Preflight ECU R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler r2 bucket list > /tmp/r2.txt
          cat /tmp/r2.txt
          grep -q "jarvis-ecu-artifacts" /tmp/r2.txt || {
            echo "::error::Required R2 bucket jarvis-ecu-artifacts is missing."
            exit 1
          }
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply jarvis-db --remote
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke
        run: |
          node - <<'NODE'
          const r=await fetch('https://jarvis-personal-ai.haydojarvis.workers.dev/api/version');
          if(!r.ok) throw new Error('smoke '+r.status);
          console.log(await r.text());
          NODE
