name: Deploy Feature JARVIS Once

on:
  push:
    branches:
      - feature/learning-engine
    paths:
      - ".github/workflows/deploy-feature-once.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feature/learning-engine
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - name: Validate
        run: npm run check
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Smoke check
        id: smoke
        continue-on-error: true
        env:
          HEALTH_URL: ${{ secrets.JARVIS_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$HEALTH_URL"
          BASE_URL="${HEALTH_URL%/}"
          BASE_URL="${BASE_URL%/api/health}"
          BASE_URL="${BASE_URL%/health}"
          curl --fail --silent --show-error --max-time 35 "$BASE_URL/api/version" >/dev/null
      - name: Roll back failed deployment
        if: steps.smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler rollback --message "Automatic rollback: attachment history cleanup failed smoke check"
          exit 1
