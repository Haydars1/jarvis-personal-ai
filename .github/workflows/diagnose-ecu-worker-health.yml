name: Cloudflare Worker Health Diagnostics (read-only)
on:
  push:
    branches:
      - diagnostics/ecu-health-20261017
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Compare configured versus canonical Worker health with error tail
        env:
          HEALTH_URL: ${{ secrets.JARVIS_HEALTH_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          (timeout 52s npx wrangler tail hayirlievlad --format json > /tmp/worker-errors.log 2>&1 || true) &
          TAIL_PID=$!
          echo '--- Current production deployments ---'
          npx wrangler deployments list --name hayirlievlad | tail -n 80 || true
          echo '--- Current production versions ---'
          npx wrangler versions list --name hayirlievlad | tail -n 80 || true
          sleep 4
          node --input-type=module <<'NODE'
          const candidates=[
            {label:'configured',value:process.env.HEALTH_URL},
            {label:'canonical',value:'https://hayirlievlad.haydojarvis.workers.dev'}
          ];
          for (const c of candidates){
            if(!c.value){console.log(c.label, 'not configured');continue;}
            let base;
            try {
              const u=new URL(c.value);base=u.origin;
              console.log(c.label,'host',u.hostname);
            } catch(e){console.log(c.label,'invalid URL');continue;}
            for (const path of ['/api/health','/']){
              try{
                const response=await fetch(base+path,{signal:AbortSignal.timeout(12000)});
                const body=(await response.text()).replace(/\s+/g,' ').slice(0,480);
                console.log(c.label,path,'HTTP',response.status,'cf-ray',response.headers.get('cf-ray'),'content-type',response.headers.get('content-type'),'body',body);
              }catch(e){console.log(c.label,path,'fetch error',String(e.message).slice(0,170));}
            }
          }
          NODE
          sleep 5
          kill "$TAIL_PID" 2>/dev/null || true
          echo "--- Sanitized Worker tail events ---"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const raw=readFileSync('/tmp/worker-errors.log','utf8');
          let parsed=0, matched=0;
          for(const line of raw.split(/\\r?\\n/)){
            let event;
            try{event=JSON.parse(line);}catch{continue;}
            parsed++;
            const path=String(event?.event?.request?.url||event?.request?.url||'');
            const exceptions=event?.exceptions||event?.logs?.filter(x=>x.level==='error')||[];
            if(!path.includes('/api/health')&&!exceptions.length)continue;
            matched++;
            console.log(JSON.stringify({outcome:event.outcome,health_request:path.includes('/api/health'),errors:exceptions.slice(0,3).map(x=>({name:String(x.name||''),message:String(x.message||'').slice(0,300),stack:String(x.stack||'').slice(0,700)}))}));
          }
          console.log('Worker tail diagnostics:',{captured_bytes:raw.length,parsed_events:parsed,matched});
          NODE
