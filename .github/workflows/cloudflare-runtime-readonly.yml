name: Cloudflare 1101 read-only diagnostics
on:
  push:
    branches:
      - diagnostics/cloudflare-runtime-20261021
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Latest bounded application errors in D1
        continue-on-error: true
        run: |
          npx wrangler d1 execute jarvis-db --remote --command "SELECT ts, substr(context,1,45) as ctx, substr(message,1,220) as msg FROM runtime_errors ORDER BY ts DESC LIMIT 8;"
          npx wrangler d1 execute jarvis-db --remote --command "SELECT ts, substr(text,1,90) as error_kind, substr(json_extract(meta, '$.message'),1,220) as message FROM logs WHERE kind='worker-runtime-exception' ORDER BY ts DESC LIMIT 5;"
      - name: Collect short pretty worker tail and trigger read-only URLs
        continue-on-error: true
        run: |
          timeout 35s npx wrangler tail hayirlievlad --format pretty --sampling-rate 0.99 > "$RUNNER_TEMP/tail.txt" 2> "$RUNNER_TEMP/stderr.txt" &
          pid=$!
          sleep 12
          for p in / /api/auth/status; do
            curl -s --max-time 15 -o /dev/null -w "HTTP_CHECK $p %{http_code}\n" "https://hayirlievlad.haydojarvis.workers.dev$p"
          done
          sleep 12
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo '===Tail status==='
          sed -E 's/(Bearer |Token |secret=)[^[:space:]]+/\1[redacted]/g' "$RUNNER_TEMP/stderr.txt" | head -c 650 || true
          echo ''
          echo '===Tail exception lines==='
          grep -Ei -A 3 'Error:|Exception|Uncaught|ReferenceError|TypeError|outcome|Failed|Connected to' "$RUNNER_TEMP/tail.txt" | tail -n 22 | head -c 1800 || true
          echo ''
          echo '===Tail size==='
          wc -c "$RUNNER_TEMP/tail.txt"
