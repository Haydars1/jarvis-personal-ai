name: Validate Native JARVIS iOS

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-native-check.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-native-check.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate native app icon
        working-directory: ios
        run: python3 scripts/generate_app_icon.py
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build simulator without signing
        working-directory: ios
        run: xcodebuild -project JARVIS.xcodeproj -scheme JARVIS -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Build iPhone Release app without signing
        working-directory: ios
        run: |
          rm -rf build-device
          xcodebuild -project JARVIS.xcodeproj -scheme JARVIS -sdk iphoneos -configuration Release -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          APP_PATH="build-device/Build/Products/Release-iphoneos/JARVIS.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :LSSupportsGameMode" "$APP_PATH/Info.plist" | grep -qx false
          /usr/libexec/PlistBuddy -c "Print :LSApplicationCategoryType" "$APP_PATH/Info.plist" | grep -qx 'public.app-category.utilities'
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP_PATH/Info.plist" >/dev/null
          test -n "$(find "$APP_PATH" -name 'AppIcon*.png' -print -quit)"
          EXT_PLIST="$APP_PATH/PlugIns/JARVISShare.appex/Info.plist"
          test -f "$EXT_PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$EXT_PLIST" | grep -qx 'com.apple.share-services'

      - name: Summary
        run: |
          echo "iOS source validated. No IPA artifact is uploaded from normal development builds." >> "$GITHUB_STEP_SUMMARY"
          echo "Use the 'Build JARVIS Workshop Beta IPA' workflow only when a consolidated test build is wanted." >> "$GITHUB_STEP_SUMMARY"

