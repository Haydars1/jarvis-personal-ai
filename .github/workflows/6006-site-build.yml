name: 6006 Production Build
on:
  push:
    branches: ["6006coding-production"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
