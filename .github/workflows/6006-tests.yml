name: 6006 Tests

on:
  push:
    branches: [6006-performance, 6006-cloudflare-work, fix/6006-v2-final, feat/6006-fault-visual-v3, fix/6006-xray-diagnostic-visual, fix/6006-photoreal-xray-boost]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify generated typed fault datasets
        run: |
          node scripts/generate-domain-data.mjs
          git diff --exit-code -- src/domain/fault-data.generated.ts src/domain/fault-localizations.generated.ts
      - name: Run legacy and UI tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Verify standalone production bundle
        run: |
          test -f dist/index.html
          if grep -R -n -E '@floot/|floot\.app' dist; then
            echo 'Floot runtime reference found in dist/'
            exit 1
          fi
      - name: Verify frontend contains no backend secrets
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.dev\.vars)$'; then
            echo 'Tracked environment/secrets file found. Commit only .example templates.'
            exit 1
          fi
          if grep -R -n -E 'service_role|VAPID_PRIVATE_KEY|AI_API_KEY|CLOUDFLARE_API_TOKEN|ACCESS_CLIENT_SECRET|sk-[A-Za-z0-9_-]{16,}' dist; then
            echo 'Backend secret marker found in frontend production bundle.'
            exit 1
          fi
      - name: Run Worker tests
        run: npm --prefix worker test
      - name: Worker TypeScript check
        run: npm --prefix worker run typecheck
      - name: Syntax checks for legacy modules
        run: |
          node --check js/i18n.mjs
          node --check js/site-i18n.mjs
          node --check js/fault-localization.mjs
          node --check js/fault-app.mjs
          node --check js/support-chat.mjs
          node --check js/ai-support.mjs
          node --check js/admin-chat.mjs
          node --check js/vehicle-selector-ui.mjs
