name: 6006 Tests

on:
  push:
    branches: [6006-performance, 6006-cloudflare-work, fix/6006-v2-final, feat/6006-fault-visual-v3, fix/6006-xray-diagnostic-visual, fix/6006-photoreal-xray-boost, fix/6006-xray-static-asset, fix/6006-xray-valid-webp, fix/6006-p0299-jpeg-final, fix/6006-ios-xray-compositor, fix/6006-p0299-webp-decode]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Verify generated typed fault datasets
        run: |
          node scripts/generate-domain-data.mjs
          git diff --exit-code -- src/domain/fault-data.generated.ts src/domain/fault-localizations.generated.ts
      - name: Verify P0299 JPEG source binary
        run: |
          set -euo pipefail
          test -s public/assets/6006/p0299-xray.jpg
          file public/assets/6006/p0299-xray.jpg | grep -q 'JPEG image data'
      - name: Verify P0299 Safari compositor CSS
        run: |
          set -euo pipefail
          CSS=src/assets/xrayBoost.css
          grep -Fq '.genericVehicle.genericVehiclePhotoreal' "$CSS"
          grep -Eq 'filter:[[:space:]]*none[[:space:]]*!important' "$CSS"
          grep -Eq 'transform:[[:space:]]*none[[:space:]]*!important' "$CSS"
          grep -Eq 'isolation:[[:space:]]*auto[[:space:]]*!important' "$CSS"
          grep -Eq 'aspect-ratio:[[:space:]]*16[[:space:]]*/[[:space:]]*9[[:space:]]*!important' "$CSS"
          grep -Eq 'object-fit:[[:space:]]*contain[[:space:]]*!important' "$CSS"
          grep -Eq 'object-position:[[:space:]]*center[[:space:]]*!important' "$CSS"
          grep -Eq 'animation:[[:space:]]*none[[:space:]]*!important' "$CSS"
      - name: Run legacy and UI tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Verify standalone production bundle
        run: |
          set -euo pipefail
          test -f dist/index.html
          test -s dist/assets/6006/p0299-xray.jpg
          file dist/assets/6006/p0299-xray.jpg | grep -q 'JPEG image data'
          if grep -R -n -E '@floot/|floot\.app' dist; then
            echo 'Floot runtime reference found in dist/'
            exit 1
          fi
      - name: Verify frontend contains no backend secrets
        run: |
          if git ls-files | grep -E '(^|/)(\.env|\.dev\.vars)$'; then
            echo 'Tracked environment/secrets file found. Commit only .example templates.'
            exit 1
          fi
          if grep -R -n -E 'service_role|VAPID_PRIVATE_KEY|AI_API_KEY|CLOUDFLARE_API_TOKEN|ACCESS_CLIENT_SECRET|sk-[A-Za-z0-9_-]{16,}' dist; then
            echo 'Backend secret marker found in frontend production bundle.'
            exit 1
          fi
      - name: Run Worker tests
        run: npm --prefix worker test
      - name: Worker TypeScript check
        run: npm --prefix worker run typecheck
      - name: Syntax checks for legacy modules
        run: |
          node --check js/i18n.mjs
          node --check js/site-i18n.mjs
          node --check js/fault-localization.mjs
          node --check js/fault-app.mjs
          node --check js/support-chat.mjs
          node --check js/ai-support.mjs
          node --check js/admin-chat.mjs
          node --check js/vehicle-selector-ui.mjs
