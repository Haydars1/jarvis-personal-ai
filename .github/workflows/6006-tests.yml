name: 6006 Tests

on:
  push:
    branches: [6006-performance, 6006-cloudflare-work]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run legacy and UI tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Syntax checks for legacy modules
        run: |
          node --check js/i18n.mjs
          node --check js/site-i18n.mjs
          node --check js/fault-localization.mjs
          node --check js/fault-app.mjs
          node --check js/support-chat.mjs
          node --check js/ai-support.mjs
          node --check js/admin-chat.mjs
          node --check js/vehicle-selector-ui.mjs
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: 6006-package-lock
          path: package-lock.json
          if-no-files-found: error
