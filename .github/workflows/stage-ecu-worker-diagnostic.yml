name: Test Worker Runtime on Isolated Temporary Cloudflare Staging
on:
  push:
    branches:
      - diagnostics/ecu-health-20261017
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Publish temporary Worker without schedule, test and clean up
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const config=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          config.name='hayirlievlad-ecu-diagnostic';
          config.triggers={crons:[]};
          writeFileSync('wrangler.diag.jsonc',JSON.stringify(config,null,2));
          NODE
          npx wrangler deploy --config wrangler.diag.jsonc
          sleep 3
          node --input-type=module <<'NODE'
          const base='https://hayirlievlad-ecu-diagnostic.haydojarvis.workers.dev';
          for(const path of ['/api/health','/','/app.js']){
            try {
              const response=await fetch(base+path,{signal:AbortSignal.timeout(15000)});
              console.log('staging',path,'HTTP',response.status,'cf-ray',response.headers.get('cf-ray'),'body',(await response.text()).replace(/\\s+/g,' ').slice(0,300));
            } catch(error){console.log('staging',path,'ERROR',String(error.message));}
          }
          NODE
          npx wrangler delete hayirlievlad-ecu-diagnostic --force || true
