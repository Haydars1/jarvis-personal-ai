name: Code Graph
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**','ios/**','schema.sql','scripts/code-graph/**','package*.json','.github/workflows/code-graph.yml','.github/scripts/code-graph-job.mjs']
permissions:
  contents: write
jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Build native graph
        run: npm run graph:build
      - name: Validate native graph
        run: npm run graph:check
      - name: Native graph tests
        run: node --test tests/code-graph*.test.js tests/native-code-graph*.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-code-graph
          path: |
            graphify-out/
            package-lock.json
          if-no-files-found: error
      - name: Sync native graph lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/native-code-graph-engine' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "refs/heads/$HEAD_REF:refs/remotes/origin/$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync native graph package lock"
          git push origin "HEAD:refs/heads/$HEAD_REF"
