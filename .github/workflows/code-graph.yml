name: Code Graph
on:
  workflow_dispatch:
  pull_request:
    paths: ['src/**','ios/**','schema.sql','scripts/code-graph/**','package*.json','.github/workflows/code-graph.yml']
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install open-source Graphify
        run: pip install 'graphifyy' || { echo 'Official Graphify package (graphifyy) unavailable; graph job degrades without blocking JARVIS runtime.'; exit 1; }
      - name: Graphify version
        run: graphify --version || true
      - name: Build graph
        run: npm run graph:build
      - name: Validate graph
        run: npm run graph:check
      - name: Focused tests
        run: node --test tests/code-graph.test.js tests/code-graph-normalizer.test.js tests/code-graph-capability.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-code-graph
          path: graphify-out/
          if-no-files-found: ignore
