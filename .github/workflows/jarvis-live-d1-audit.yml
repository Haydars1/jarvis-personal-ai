name: JARVIS live D1 learning audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Cloudflare credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Inspect live database (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo "## JARVIS live D1 audit" >> "$GITHUB_STEP_SUMMARY"
          echo "Checked at: $(date -u +'%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Table | Rows |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          npx --yes wrangler@4 d1 execute jarvis-db --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('learning_sources','learning_chunks','ecu_manual_library_documents','ecu_manual_library_passages','memories','runtime_errors') ORDER BY name;" --json > /tmp/jarvis-tables.json
          node --input-type=module -e '
            import fs from "node:fs";
            const data=JSON.parse(fs.readFileSync("/tmp/jarvis-tables.json","utf8"));
            const rows=data.flatMap(x=>x.results??[]);
            fs.writeFileSync("/tmp/jarvis-tables.txt",rows.map(x=>x.name).join("\n"));
          '
          for table in learning_sources learning_chunks ecu_manual_library_documents ecu_manual_library_passages memories runtime_errors; do
            if grep -qx "$table" /tmp/jarvis-tables.txt; then
              npx --yes wrangler@4 d1 execute jarvis-db --remote --command "SELECT COUNT(*) AS total FROM $table;" --json > /tmp/jarvis-count.json
              count=$(node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync("/tmp/jarvis-count.json","utf8")); console.log(d[0]?.results?.[0]?.total ?? "unknown")')
              echo "| $table | $count |" >> "$GITHUB_STEP_SUMMARY"
              echo "$table: $count"
            else
              echo "| $table | table not found |" >> "$GITHUB_STEP_SUMMARY"
              echo "$table: table not found"
            fi
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Counts are live D1 row totals, not proof that every uploaded PDF was fully parsed." >> "$GITHUB_STEP_SUMMARY"
