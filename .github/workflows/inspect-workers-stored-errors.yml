name: Inspect Stored Cloudflare Worker Exceptions (read-only)
on:
  push:
    branches:
      - diagnostics/hayirlievlad-metadata-20261017
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Query only hayirlievlad stored error metadata
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/observability/telemetry/query';
          const now=Date.now();
          const payload={
            queryId:'hayirlievlad-error-investigation',
            timeframe:{from:now-2*3600*1000,to:now},
            parameters:{datasets:[],filters:[{key:'$metadata.service',operation:'eq',type:'string',value:'hayirlievlad'}],filterCombination:'and'},
            view:'events',limit:30,chart:false,dry:true
          };
          const res=await fetch(root,{method:'POST',headers:{Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'},body:JSON.stringify(payload)});
          let obj;try{obj=await res.json()}catch{obj={}};
          console.log('Query HTTP',res.status,'success',obj.success,'codes',(obj.errors||[]).map(x=>x.code||String(x.message).slice(0,90)));
          const results=obj.result||{};
          console.log('Available fields',Object.keys(results),'events',(results.events||[]).length,'statistics',results.statistics?.rows_read);
          for(const e of (results.events||[]).slice(0,30)){
            const m=e.$metadata||e.metadata||{};
            const kind=String(m.level||m.type||m.kind||e.level||'');
            const msg=String(m.error||m.message||e.message||'').slice(0,400);
            if(!/exception|error|failed|fatal|1101|startup|worker/i.test(msg+' '+kind))continue;
            console.log('Error entry',JSON.stringify({kind,service:String(m.service||'').slice(0,60),origin:String(m.origin||'').slice(0,50),time:e.timestamp||m.timestamp,message:msg}));
          }
          NODE
