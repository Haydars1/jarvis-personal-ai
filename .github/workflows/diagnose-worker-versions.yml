name: Probe hayirlievlad Worker Version URLs (read-only)
on:
  push:
    branches:
      - diagnostics/hayirlievlad-metadata-20261017
permissions:
  contents: read
jobs:
  version-health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check historical version health without modifying production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const {CLOUDFLARE_ACCOUNT_ID:id,CLOUDFLARE_API_TOKEN:token}=process.env;
          const base='https://api.cloudflare.com/client/v4/accounts/'+id+'/workers/scripts/hayirlievlad';
          const res=await fetch(base+'/versions',{headers:{Authorization:'Bearer '+token}});
          const data=await res.json();
          const versions=Array.isArray(data.result?.items)?data.result.items:Array.isArray(data.result?.versions)?data.result.versions:Array.isArray(data.result)?data.result:[];
          console.log('Versions',versions.length);
          for(const v of versions.slice(0,14)){
            const prefix=v.id.slice(0,8);
            const url='https://'+prefix+'-hayirlievlad.haydojarvis.workers.dev/api/health';
            try{
              const r=await fetch(url,{signal:AbortSignal.timeout(7000)});
              const text=(r.headers.get('content-type')||'').includes('json')?(await r.text()).slice(0,130):'';
              console.log(prefix,'HTTP',r.status,'type',r.headers.get('content-type'),'body',text);
            }catch(e){console.log(prefix,e?.name)}
          }
          NODE
