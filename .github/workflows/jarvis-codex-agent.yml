name: JARVIS Autonomous Development Agent

on:
  workflow_dispatch:
  push:
    branches:
      - test/autonomy-runtime
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: write
  pull-requests: write
  actions: read
  id-token: write

concurrency:
  group: jarvis-autonomous-development
  cancel-in-progress: false

jobs:
  develop:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/test/autonomy-runtime')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Baseline validation
        id: baseline
        continue-on-error: true
        run: npm run check

      - name: Fetch native skill backlog
        shell: bash
        env:
          JARVIS_URL: https://haydojarvis.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const output='/tmp/jarvis-skill-backlog.json';
          try {
            const requestUrl=process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const requestToken=process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if(!requestUrl||!requestToken)throw new Error('OIDC unavailable');
            const sep=requestUrl.includes('?')?'&':'?';
            const oidc=await fetch(`${requestUrl}${sep}audience=jarvis-skill-builder`,{headers:{Authorization:`bearer ${requestToken}`}});
            if(!oidc.ok)throw new Error(`OIDC ${oidc.status}`);
            const token=(await oidc.json()).value;
            const response=await fetch(`${process.env.JARVIS_URL}/api/tools/skills/runner/backlog?limit=8`,{headers:{Authorization:`Bearer ${token}`,Accept:'application/json'}});
            if(!response.ok)throw new Error(`BACKLOG ${response.status}`);
            writeFileSync(output,JSON.stringify(await response.json(),null,2));
          } catch (error) {
            console.warn('Skill backlog unavailable:',error.message);
            writeFileSync(output,JSON.stringify({skills:[],error:String(error.message||error)},null,2));
          }
          NODE
          cat /tmp/jarvis-skill-backlog.json

      - name: Create isolated development branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          name="jarvis/auto-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Write autonomous development prompt
        shell: bash
        run: |
          cat > /tmp/jarvis-dev-prompt.txt <<'EOF'
          Work only in this checked-out JARVIS repository on the current isolated jarvis/auto-* branch.
          Start from the current main implementation. Inspect code, tests and architecture before editing.
          Read src/lib/capability-policy.js, src/lib/native-skill-adapters.js, and /tmp/jarvis-skill-backlog.json before choosing work.

          Repository-skill priority:
          - If /tmp/jarvis-skill-backlog.json contains skills, prefer one useful low/medium-risk missing skill when it can be completed safely in this run.
          - Treat the source repository and its repo_skills manifest as a behavioral specification/reference, not as code to vendor.
          - Use a clean-room reimplementation: understand the behavior/interface, then implement equivalent JARVIS-native behavior with our own code and tests.
          - Do not copy third-party source code, large snippets, license headers, generated assets, model weights, or install scripts into JARVIS.
          - Preserve attribution/source metadata in tests/docs where useful, but the implementation must stand on its own.
          - When the native implementation is verified, add/update src/lib/native-skill-adapters.js so the learned repo skill resolves to adapter_status ready.
          - For GPU-heavy capabilities, create a safe cloud adapter contract rather than pretending CPU Workers can run the model.
          - For physical vehicle capabilities, keep execution on the confirmation-gated device-bridge. Never fake device success.

          Prioritize, in order:
          1. broken tests, runtime defects and incomplete end-to-end paths,
          2. useful unadapted repo_skills that reduce dependence on paid AI/API calls,
          3. task-aware provider routing, quota/failover reliability and observability,
          4. persistent conversation/task continuity and learning context,
          5. social/video automation using official APIs or verified local/open-source capabilities,
          6. ECU file analysis, diagnostics, safe local device-bridge architecture and service workflows,
          7. regression coverage, performance, mobile UX and maintainability.
          Define a concrete acceptance condition for each change and add/update regression tests when practical.
          Continue to another independent useful improvement while time remains; do not stop after a cosmetic edit.
          Never modify or print secrets/credentials. Never weaken tests or security gates. Never deploy production, merge main,
          force-push, delete user data, spend money, or perform irreversible external actions.
          Do not implement automatic road-vehicle emissions-control defeat patches. Diagnostic analysis, file inspection,
          restoration, service procedures, and test/off-road analysis tooling are allowed.
          Run npm run check before finishing. Leave verified source changes uncommitted; the workflow will commit and open a PR.
          EOF

      - name: Install OpenCode provider runner
        run: npm install --global @opencode/cli

      - name: Run best available coding specialist
        id: multiprovider
        continue-on-error: true
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bash .github/scripts/run-coding-provider-fallback.sh /tmp/jarvis-dev-prompt.txt

      - name: Reset failed specialist work
        if: ${{ steps.multiprovider.outcome != 'success' }}
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Run Codex fallback
        id: codex
        if: ${{ steps.multiprovider.outcome != 'success' }}
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: drop-sudo
          allow-bot-users: "github-actions[bot]"
          prompt: |
            Work only in this repository on the current jarvis/auto-* branch.
            Read /tmp/jarvis-dev-prompt.txt and /tmp/jarvis-skill-backlog.json and follow them. Make useful safe improvements,
            run npm run check, and leave verified changes uncommitted.

      - name: Reset failed Codex work
        if: ${{ steps.multiprovider.outcome != 'success' && steps.codex.outcome != 'success' }}
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Restore keyless local coder cache
        if: ${{ steps.multiprovider.outcome != 'success' && steps.codex.outcome != 'success' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/jarvis-local-coder
          key: jarvis-local-coder-v1-${{ runner.os }}-qwen3-1.7b-q4km

      - name: Run keyless local coding fallback
        id: localcoder
        if: ${{ steps.multiprovider.outcome != 'success' && steps.codex.outcome != 'success' }}
        continue-on-error: true
        shell: bash
        run: bash .github/scripts/run-local-coder-fallback.sh /tmp/jarvis-dev-prompt.txt

      - name: Reset failed local coding work
        if: ${{ steps.multiprovider.outcome != 'success' && steps.codex.outcome != 'success' && steps.localcoder.outcome != 'success' }}
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Require a coding agent to succeed
        if: ${{ steps.multiprovider.outcome != 'success' && steps.codex.outcome != 'success' && steps.localcoder.outcome != 'success' }}
        run: |
          echo "::error::Hosted providers, Codex, and the keyless local coder all failed."
          exit 1

      - name: Validate agent changes
        run: npm run check

      - name: Cloudflare build dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry

      - name: Commit and open tested PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          PRIMARY_PROVIDER: ${{ steps.multiprovider.outputs.provider }}
          PRIMARY_MODEL: ${{ steps.multiprovider.outputs.model }}
          CODEX_OUTCOME: ${{ steps.codex.outcome }}
          LOCAL_PROVIDER: ${{ steps.localcoder.outputs.provider }}
          LOCAL_MODEL: ${{ steps.localcoder.outputs.model }}
        run: |
          set -euo pipefail
          rm -rf .wrangler-dry
          if git diff --quiet && git diff --cached --quiet; then
            echo "No verified source changes produced; nothing to promote."
            exit 0
          fi

          git config user.name "jarvis-autonomous-agent"
          git config user.email "jarvis-autonomous-agent@users.noreply.github.com"
          git add -A
          git commit -m "feat(agent): autonomous verified JARVIS improvement"

          gh auth setup-git
          git push origin "HEAD:$BRANCH"

          if [ -n "${PRIMARY_PROVIDER:-}" ]; then
            provider="$PRIMARY_PROVIDER"
            model="${PRIMARY_MODEL:-unknown}"
          elif [ "${CODEX_OUTCOME:-}" = "success" ]; then
            provider="Codex fallback"
            model="OpenAI Codex"
          else
            provider="${LOCAL_PROVIDER:-Local Qwen3}"
            model="${LOCAL_MODEL:-Qwen/Qwen3-1.7B-GGUF:Q4_K_M}"
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "JARVIS autonomous verified improvement" \
            --body "Autonomous development run ${GITHUB_RUN_ID}. Provider: ${provider}. Model: ${model}. The run passed npm run check and Cloudflare dry-run before opening this PR. The repository self-update workflow will independently test it again before merge."
