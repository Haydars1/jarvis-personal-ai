name: JARVIS Codex Development Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: read

# Scheduled runs only operate on the development branch and are serialized below.

concurrency:
  group: jarvis-codex-development-agent
  cancel-in-progress: false

jobs:
  develop:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/feature/learning-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v5
        with:
          ref: feature/learning-engine
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Baseline validation
        id: baseline
        continue-on-error: true
        run: npm run check

      - name: Record baseline state
        shell: bash
        run: |
          echo "Baseline validation outcome: ${{ steps.baseline.outcome }}"
          if [ "${{ steps.baseline.outcome }}" != "success" ]; then
            echo "Baseline is already failing; the coding agent should diagnose and repair it."
          fi

      - name: Detect Gemini fallback
        id: fallback
        shell: bash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "${GEMINI_API_KEY:-}" ]; then
            echo "gemini=true" >> "$GITHUB_OUTPUT"
          else
            echo "gemini=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Codex development agent
        id: codex
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            Work only in this checked-out repository on branch feature/learning-engine.
            Continue the current JARVIS development autonomously for this run.
            Inspect the implementation and tests before editing. Prioritize:
            1. conversation and task continuity,
            2. persistent learning-context integration,
            3. real video-provider execution/failover,
            4. reliability, observability, regression coverage, performance, UX, maintainability.

            Do not stop after one tiny edit when more safe independent work can be completed.
            Use tests-first where practical. For every change, keep it small and reversible,
            preserve existing behavior, and run relevant tests. Never modify GitHub secrets,
            credentials, workflow security boundaries, production deployment configuration,
            main branch, or external accounts. Never deploy production. Do not disable or
            weaken tests/security gates. Do not push or commit; leave verified workspace
            changes for the workflow to validate and commit.

            Before finishing, run npm run check. If it fails because of your changes, fix it
            and rerun. Finish only with a concise summary of concrete verified changes.

      - name: Reset unverified Codex changes before fallback
        if: ${{ steps.codex.outcome != 'success' && steps.fallback.outputs.gemini == 'true' }}
        shell: bash
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Install Gemini CLI fallback
        if: ${{ steps.codex.outcome != 'success' && steps.fallback.outputs.gemini == 'true' }}
        run: npm install -g @google/gemini-cli

      - name: Run Gemini development fallback
        id: gemini
        if: ${{ steps.codex.outcome != 'success' && steps.fallback.outputs.gemini == 'true' }}
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          PROMPT=$(cat <<'EOF'
          Work only in this checked-out repository on branch feature/learning-engine.
          The primary Codex agent was unavailable, so you are the fallback coding agent.
          Inspect the implementation and make safe, reversible improvements. Prioritize
          conversation/task continuity, persistent learning-context integration, provider
          failover, reliability, observability, regression coverage, performance, UX, and
          maintainability. Do not modify credentials, secrets, GitHub workflows, production
          deployment configuration, branch protections, or security gates. Do not commit,
          push, deploy, delete data, or spend money. Use repository read/edit tools only;
          the workflow will validate all changes after you finish. Leave changes in the working tree.
          EOF
          )
          gemini --model gemini-3.7-flash --skip-trust --approval-mode auto_edit -p "$PROMPT"

      - name: Require a coding agent to succeed
        if: ${{ steps.codex.outcome != 'success' && steps.gemini.outcome != 'success' }}
        shell: bash
        run: |
          echo "::error::No coding agent completed successfully. Codex failed and Gemini fallback was unavailable or failed."
          exit 1

      - name: Validate agent changes
        run: npm run check

      - name: Cloudflare build dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry

      - name: Commit verified changes to development branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .wrangler-dry
          if git diff --quiet && git diff --cached --quiet; then
            echo "No verified source changes to commit."
            exit 0
          fi
          git config user.name "jarvis-codex-agent"
          git config user.email "jarvis-codex-agent@users.noreply.github.com"
          git add -A
          git commit -m "feat(agent): autonomous verified JARVIS improvements"
          gh auth setup-git
          git push origin HEAD:feature/learning-engine
