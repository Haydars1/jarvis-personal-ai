name: JARVIS Codex Development Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  actions: read

concurrency:
  group: jarvis-codex-development-agent
  cancel-in-progress: false

jobs:
  develop:
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/feature/learning-engine'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v5
        with:
          ref: feature/learning-engine
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Baseline validation
        id: baseline
        continue-on-error: true
        run: npm run check

      - name: Write coding task prompt
        shell: bash
        run: |
          cat > /tmp/jarvis-dev-prompt.txt <<'EOF'
          Work only in this checked-out repository on branch feature/learning-engine.
          Continue JARVIS development autonomously. Inspect implementation and tests before editing.
          Read src/lib/capability-policy.js and choose useful missing work from the capability system rather than waiting for a user idea.
          Prioritize continuity, persistent learning, provider routing/failover, social/video automation, ECU diagnostic/file-analysis
          infrastructure, safe device-bridge architecture, reliability, observability, regression coverage, performance, UX and maintainability.
          Use tests-first where practical. Keep changes small and reversible. Never change secrets, credentials, workflow security boundaries,
          production deployment configuration, branch protections or main. Never deploy, delete data or spend money.
          Do not implement emissions-control defeat patches or automated road-vehicle emissions bypasses.
          Run npm run check before finishing. Leave verified changes uncommitted in the working tree.
          EOF

      - name: Install OpenCode task-aware provider runner
        run: npm install --global @opencode/cli

      - name: Run best available coding specialist
        id: multiprovider
        continue-on-error: true
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: bash .github/scripts/run-coding-provider-fallback.sh /tmp/jarvis-dev-prompt.txt

      - name: Reset failed specialist work
        if: ${{ steps.multiprovider.outcome != 'success' }}
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Run Codex fallback
        id: codex
        if: ${{ steps.multiprovider.outcome != 'success' }}
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          prompt: |
            Work only in this repository on feature/learning-engine. Follow the capability-driven development priorities in
            /tmp/jarvis-dev-prompt.txt, validate changes, and leave them uncommitted.

      - name: Reset failed Codex fallback work
        if: ${{ steps.multiprovider.outcome != 'success' && steps.codex.outcome != 'success' }}
        run: |
          git reset --hard HEAD
          git clean -fd

      - name: Require a coding agent to succeed
        if: ${{ steps.multiprovider.outcome != 'success' && steps.codex.outcome != 'success' }}
        run: exit 1

      - name: Validate agent changes
        run: npm run check

      - name: Cloudflare build dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry

      - name: Commit verified changes to development branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf .wrangler-dry
          if git diff --quiet && git diff --cached --quiet; then
            echo "No verified source changes to commit."
            exit 0
          fi
          git config user.name "jarvis-codex-agent"
          git config user.email "jarvis-codex-agent@users.noreply.github.com"
          git add -A
          git commit -m "feat(agent): autonomous verified JARVIS improvements"
          gh auth setup-git
          git push origin HEAD:feature/learning-engine
