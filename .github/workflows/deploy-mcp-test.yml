name: Deploy isolated MCP OAuth test Worker
on:
  push:
    branches: [feature/shared-mcp-cloudflare]
    paths:
      - 'mcp-worker/**'
      - '.github/workflows/deploy-mcp-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-hayirlievlad-mcp-test
  cancel-in-progress: false
jobs:
  deploy-test-only:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MCP_TEST_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests and syntax
        run: npm run check && npm test
      - name: Check required Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Resolve existing KV namespace without changing it
        run: |
          npx wrangler kv namespace list > /tmp/mcp-kv.json
          node - <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('/tmp/mcp-kv.json', 'utf8');
          const a = JSON.parse(raw.slice(raw.indexOf('[')));
          const matches = a.filter(x => x.title === 'hayirlievlad-mcp-oauth-kv');
          if (matches.length !== 1 || !/^[a-f0-9]{32}$/.test(matches[0].id)) throw Error('Expected exactly one existing OAuth KV namespace');
          fs.appendFileSync('wrangler.toml', '\n[[kv_namespaces]]\nbinding = "OAUTH_KV"\nid = "' + matches[0].id + '"\n');
          NODE
      - name: Build test Worker before deployment
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/mcp-worker-build
      - name: Deploy ONLY isolated MCP test Worker
        run: npx wrangler deploy --config wrangler.toml --name hayirlievlad-shared-mcp
      - name: Check OAuth discovery and authentication boundary
        run: |
          set -eu
          BASE="https://hayirlievlad-shared-mcp.haydojarvis.workers.dev"
          curl --fail --silent --show-error "$BASE/.well-known/oauth-authorization-server" > /tmp/oauth-discovery.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/oauth-discovery.json"));if(!d.authorization_endpoint||!d.token_endpoint)process.exit(1)'
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/mcp" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          test "$STATUS" = "401"
