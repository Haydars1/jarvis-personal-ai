name: Deploy isolated MCP OAuth test Worker
on:
  push:
    branches: [feature/shared-mcp-cloudflare]
    paths:
      - 'mcp-worker/**'
      - '.github/workflows/deploy-mcp-test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: isolated-hayirlievlad-mcp-test
  cancel-in-progress: false
jobs:
  deploy-test-only:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_MCP_TEST_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated Worker dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests and syntax
        run: npm run check && npm test
      - name: Check required Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Resolve existing KV namespace without changing it
        run: |
          npx wrangler kv namespace list > /tmp/mcp-kv.json
          node - <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('/tmp/mcp-kv.json', 'utf8');
          const a = JSON.parse(raw.slice(raw.indexOf('[')));
          const matches = a.filter(x => x.title === 'hayirlievlad-mcp-oauth-kv');
          if (matches.length !== 1 || !/^[a-f0-9]{32}$/.test(matches[0].id)) throw Error('Expected exactly one existing OAuth KV namespace');
          fs.appendFileSync('wrangler.toml', '\n[[kv_namespaces]]\nbinding = "OAUTH_KV"\nid = "' + matches[0].id + '"\n');
          NODE
      - name: Build test Worker before deployment
        run: npx wrangler deploy --config wrangler.toml --dry-run --outdir /tmp/mcp-worker-build
      - name: Local OAuth discovery smoke test
        run: |
          (npx wrangler dev --config wrangler.toml --local --port 8799 > /tmp/mcp-local.log 2>&1 & echo $! > /tmp/mcp-local.pid)
          sleep 7
          curl -sS -i --max-time 5 http://127.0.0.1:8799/.well-known/oauth-authorization-server | head -c 1500
          echo
          tail -c 2500 /tmp/mcp-local.log
          kill $(cat /tmp/mcp-local.pid) || true
      - name: Deploy ONLY isolated MCP test Worker
        run: npx wrangler deploy --config wrangler.toml --name hayirlievlad-shared-mcp
      - name: Capture isolated Worker runtime errors safely
        run: |
          (timeout 20s npx wrangler tail hayirlievlad-shared-mcp --format json > /tmp/mcp-tail.jsonl 2>&1 || true) &
          sleep 5
          curl -s -o /dev/null "$BASE/.well-known/oauth-authorization-server" || true
          wait || true
          node - <<'NODE'
          const fs=require('fs');const s=fs.readFileSync('/tmp/mcp-tail.jsonl','utf8');for(const line of s.split('\n')){try{const e=JSON.parse(line);if(e.exceptions?.length)console.log(JSON.stringify(e.exceptions).slice(0,1800));}catch{}}
          NODE
        env:
          BASE: https://hayirlievlad-shared-mcp.haydojarvis.workers.dev
      - name: Query Worker runtime logs for OAuth exception
        if: always()
        run: |
          (timeout 18s npx wrangler tail hayirlievlad-shared-mcp --format json > /tmp/mcp-tail-debug.jsonl 2>&1 || true) &
          sleep 6
          curl -s -o /dev/null "https://hayirlievlad-shared-mcp.haydojarvis.workers.dev/.well-known/oauth-authorization-server" || true
          wait || true
          node - <<'NODE'
          const fs=require('fs');for(const line of fs.readFileSync('/tmp/mcp-tail-debug.jsonl','utf8').split('\\n')){try{const e=JSON.parse(line);if(e.exceptions?.length)console.log('WORKER_EXCEPTION',JSON.stringify(e.exceptions).slice(0,3000));}catch{}}
          NODE
      - name: Report runtime log collection status
        if: always()
        run: |
          for f in /tmp/mcp-tail.jsonl /tmp/mcp-tail-debug.jsonl; do
            echo "Log capture: $f"
            if [ -f "$f" ]; then
              grep -E 'ERROR|Error|error|permission|not authorized|forbidden|exception|tail' "$f" | head -c 1200 || true
            fi
          done
      - name: Check OAuth discovery and authentication boundary
        run: |
          set -eu
          BASE="https://hayirlievlad-shared-mcp.haydojarvis.workers.dev"
          curl --silent --show-error -D /tmp/oauth-headers.txt "$BASE/.well-known/oauth-authorization-server" > /tmp/oauth-discovery.json
          node -e 'const fs=require("fs");const body=fs.readFileSync("/tmp/oauth-discovery.json","utf8");if(body.trim().startsWith("{"))process.exit(0);console.error("OAuth discovery returned non-JSON; body:",body.slice(0,200),"HTTP headers:",fs.readFileSync("/tmp/oauth-headers.txt","utf8"));process.exit(1)'
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/oauth-discovery.json"));if(!d.authorization_endpoint||!d.token_endpoint)process.exit(1)'
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$BASE/mcp" -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"tools/list"}')
          test "$STATUS" = "401"
