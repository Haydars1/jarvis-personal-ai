name: Identify Current Cloudflare Worker Names (read-only)
on:
  push:
    branches: [diagnostics/ecu-health-20261017]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: List only Worker names in connected Cloudflare account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4';
          const headers={'Authorization':'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          for(const path of ['/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/scripts','/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/workers/services']){
            try{
              const r=await fetch(base+path,{headers,signal:AbortSignal.timeout(12000)});
              const data=await r.json();
              const results=Array.isArray(data.result)?data.result:[];
              console.log(path.split('/').pop(), 'HTTP',r.status,'success',data.success,'count',results.length,'names',results.map(x=>x.id||x.name).sort().slice(0,100));
              if(!data.success)console.log('Error codes:',(data.errors||[]).map(x=>x.code));
            }catch(e){console.log('Request failed',path.split('/').pop(),e?.name);}
          }
          NODE
          echo "--- Current renamed Worker HTTP status ---"
          node --input-type=module <<'NODE'
          const base='https://hayirlievlad.haydojarvis.workers.dev';
          for(const path of ['/api/health','/','/api/auth/status','/api/ecu/manual-library/stats']){
            try {
              const r=await fetch(base+path,{signal:AbortSignal.timeout(12000)});
              const raw=(await r.text()).replace(/\s+/g,' ').slice(0,450);
              console.log(path, 'HTTP', r.status, 'type', r.headers.get('content-type'), 'body', raw);
            } catch(e){console.log(path, 'request failed', e?.name);}
          }
          NODE
