name: JARVIS Reliability Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Syntax and behavioral regression tests
        run: npm run check
      - name: Cloudflare bundle validation
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry
