name: JARVIS Reliability Checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Syntax and behavioral regression tests
        run: npm run check
      - name: Install browser test runtime
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Full Worker HTTP and browser integration
        env:
          JARVIS_BROWSER_TEST: '1'
        run: npm run test:integration
      - name: Browser verification images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-browser-verification
          path: .wrangler/browser-report/
          if-no-files-found: ignore
      - name: Cloudflare bundle validation
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry
