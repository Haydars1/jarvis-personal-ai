name: Isolate Cloudflare 1101 binding failures in unpublished versions
on:
  push:
    branches: [diagnostics/hayirlievlad-metadata-20261017]
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Compare clean Worker previews without deploying or modifying database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const original=JSON.parse(readFileSync('wrangler.jsonc','utf8'));
          if(original.name!=='hayirlievlad')throw new Error('wrong Worker name');
          const base={
            name:original.name,
            main:'src/isolated-worker-probe.js',
            compatibility_date:original.compatibility_date,
            compatibility_flags:original.compatibility_flags,
            observability:{enabled:true}
          };
          const cases={
            'pure':{},
            'd1':{d1_databases:original.d1_databases},
            'ai':{ai:original.ai},
            'assets':{assets:original.assets},
            'all':{
              d1_databases:original.d1_databases,
              ai:original.ai,
              assets:original.assets
            }
          };
          for (const [key,bindings] of Object.entries(cases)){
            const config={...base,...bindings};
            writeFileSync('wrangler.probe-'+key+'.jsonc',JSON.stringify(config,null,2));
          }
          NODE
          for mode in pure d1 ai assets all; do
            echo "Uploading UNDEPLOYED config: $mode"
            if npx wrangler versions upload --config "wrangler.probe-$mode.jsonc" --preview-alias "probe$mode" >"/tmp/upload-$mode.log" 2>&1; then
              echo "upload_result $mode OK"
              grep -E "Uploaded|Version ID|Preview|workers.dev" "/tmp/upload-$mode.log" || true
            else
              echo "upload_result $mode FAILED"
              grep -E "ERROR|Error|error|✘|100[0-9]+|Unsupported|config|versions upload|unknown" "/tmp/upload-$mode.log" | tail -n 12 || true
            fi
          done
          node --input-type=module <<'NODE'
          const host='hayirlievlad.haydojarvis.workers.dev';
          for(const mode of ['pure','d1','ai','assets','all']){
            const url='https://probe'+mode+'-'+host+'/api/health';
            for(let attempt=0;attempt<3;attempt++){
              try{
                const r=await fetch(url,{signal:AbortSignal.timeout(11000)});
                console.log(JSON.stringify({config:mode,status:r.status,type:r.headers.get('content-type'),ray:r.headers.get('cf-ray')}));
                if(r.status===200)console.log('probe_body',mode,(await r.text()).slice(0,160));
                if(r.status===200)break;
              } catch(e){console.log(mode,e.name)}
              await new Promise(resolve=>setTimeout(resolve,1000));
            }
          }
          NODE
