name: 6006 Cloudflare Deploy

on:
  push:
    branches: [6006-performance]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: 6006-cloudflare-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DB_NAME: 6006-performance-db
      WORKER_NAME: 6006-performance
      SITE_HOST: 6006-performance.haydojarvis.workers.dev
      ADMIN_EMAIL: 6006performance@gmail.com
      ACCESS_APP_NAME: 6006 Performance Admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify 6006 before deploy
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-domain-data.mjs
          git diff --exit-code -- src/domain/fault-data.generated.ts src/domain/fault-localizations.generated.ts
          npm test
          npm run typecheck
          npm --prefix worker test
          npm --prefix worker run typecheck
          npm run build
          test -f dist/index.html
          if grep -R -n -E '@floot/|floot\.app|service_role|VAPID_PRIVATE_KEY|AI_API_KEY|CLOUDFLARE_API_TOKEN|ACCESS_CLIENT_SECRET|sk-[A-Za-z0-9_-]{16,}' dist; then
            echo 'Unsafe runtime/dependency marker found in production bundle.'
            exit 1
          fi

      - name: Find or create EU D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database"

          LIST_JSON=$(curl --fail --silent --show-error "$API?per_page=100" -H "$AUTH")
          echo "$LIST_JSON" | jq -e '.success == true' >/dev/null
          DB_ID=$(echo "$LIST_JSON" | jq -r --arg name "$DB_NAME" '.result[] | select(.name == $name) | .uuid' | head -n1)

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            CREATE_JSON=$(curl --fail --silent --show-error -X POST "$API" \
              -H "$AUTH" \
              -H 'Content-Type: application/json' \
              --data "{\"name\":\"$DB_NAME\",\"jurisdiction\":\"eu\"}")
            echo "$CREATE_JSON" | jq -e '.success == true' >/dev/null
            DB_ID=$(echo "$CREATE_JSON" | jq -r '.result.uuid')
          fi

          test -n "$DB_ID"
          test "$DB_ID" != "null"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Configure Cloudflare Access admin protection
        id: access
        shell: bash
        run: |
          set -euo pipefail
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          BASE="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/access"

          ORG_JSON=$(curl --fail --silent --show-error "$BASE/organizations" -H "$AUTH")
          echo "$ORG_JSON" | jq -e '.success == true' >/dev/null
          AUTH_DOMAIN=$(echo "$ORG_JSON" | jq -r '.result.auth_domain // empty')
          test -n "$AUTH_DOMAIN"

          APPS_JSON=$(curl --fail --silent --show-error "$BASE/apps?per_page=100" -H "$AUTH")
          echo "$APPS_JSON" | jq -e '.success == true' >/dev/null
          APP_ID=$(echo "$APPS_JSON" | jq -r --arg name "$ACCESS_APP_NAME" '.result[] | select(.name == $name) | .id' | head -n1)

          if [ -z "$APP_ID" ] || [ "$APP_ID" = "null" ]; then
            APP_PAYLOAD=$(jq -n \
              --arg name "$ACCESS_APP_NAME" \
              --arg host "$SITE_HOST" \
              '{
                name: $name,
                type: "self_hosted",
                domain: ($host + "/admin"),
                session_duration: "24h",
                app_launcher_visible: false,
                destinations: [
                  {type: "public", uri: ($host + "/admin")},
                  {type: "public", uri: ($host + "/admin/*")},
                  {type: "public", uri: ($host + "/api/admin")},
                  {type: "public", uri: ($host + "/api/admin/*")}
                ]
              }')
            CREATE_APP=$(curl --fail --silent --show-error -X POST "$BASE/apps" \
              -H "$AUTH" \
              -H 'Content-Type: application/json' \
              --data "$APP_PAYLOAD")
            echo "$CREATE_APP" | jq -e '.success == true' >/dev/null
            APP_ID=$(echo "$CREATE_APP" | jq -r '.result.id')
          fi

          APP_JSON=$(curl --fail --silent --show-error "$BASE/apps/$APP_ID" -H "$AUTH")
          echo "$APP_JSON" | jq -e '.success == true' >/dev/null
          ACCESS_AUD=$(echo "$APP_JSON" | jq -r '.result.aud // empty')
          test -n "$ACCESS_AUD"

          POLICIES_JSON=$(curl --fail --silent --show-error "$BASE/apps/$APP_ID/policies?per_page=100" -H "$AUTH")
          echo "$POLICIES_JSON" | jq -e '.success == true' >/dev/null
          POLICY_ID=$(echo "$POLICIES_JSON" | jq -r '.result[] | select(.name == "6006 Owner") | .id' | head -n1)

          if [ -z "$POLICY_ID" ] || [ "$POLICY_ID" = "null" ]; then
            POLICY_PAYLOAD=$(jq -n \
              --arg email "$ADMIN_EMAIL" \
              '{
                name: "6006 Owner",
                precedence: 1,
                decision: "allow",
                include: [{email: {email: $email}}]
              }')
            CREATE_POLICY=$(curl --fail --silent --show-error -X POST "$BASE/apps/$APP_ID/policies" \
              -H "$AUTH" \
              -H 'Content-Type: application/json' \
              --data "$POLICY_PAYLOAD")
            echo "$CREATE_POLICY" | jq -e '.success == true' >/dev/null
          fi

          echo "team_domain=https://$AUTH_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "aud=$ACCESS_AUD" >> "$GITHUB_OUTPUT"
          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"

      - name: Generate ephemeral Wrangler config
        shell: bash
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
          ACCESS_TEAM_DOMAIN: ${{ steps.access.outputs.team_domain }}
          ACCESS_AUD: ${{ steps.access.outputs.aud }}
        run: |
          set -euo pipefail
          jq -n \
            --arg dbid "$DB_ID" \
            --arg dbname "$DB_NAME" \
            --arg worker "$WORKER_NAME" \
            --arg accessTeamDomain "$ACCESS_TEAM_DOMAIN" \
            --arg accessAud "$ACCESS_AUD" \
            --arg adminEmail "$ADMIN_EMAIL" \
            '{
              name: $worker,
              main: "src/index.ts",
              compatibility_date: "2026-10-04",
              vars: {
                ALLOWED_ORIGIN: "https://6006.invalid",
                ACCESS_TEAM_DOMAIN: $accessTeamDomain,
                ACCESS_AUD: $accessAud,
                ADMIN_EMAIL: $adminEmail
              },
              d1_databases: [{
                binding: "DB",
                database_name: $dbname,
                database_id: $dbid
              }],
              assets: {
                directory: "../dist",
                binding: "ASSETS",
                not_found_handling: "single-page-application",
                run_worker_first: ["/api/*"]
              }
            }' > worker/wrangler.deploy.jsonc

      - name: Apply D1 schema
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@latest d1 execute DB --remote \
            --file=worker/migrations/0001_chat_core.sql \
            --config=worker/wrangler.deploy.jsonc
          npx wrangler@latest d1 execute DB --remote \
            --command="SELECT name FROM sqlite_master WHERE type='table' AND name IN ('conversations','messages','notification_milestones','push_subscriptions') ORDER BY name;" \
            --config=worker/wrangler.deploy.jsonc

      - name: Deploy 6006 Worker and static site
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler@latest deploy --config=worker/wrangler.deploy.jsonc 2>&1 | tee deploy.log
          URL=$(grep -Eo 'https://[^[:space:]]+[.]workers[.]dev' deploy.log | tail -n1 || true)
          if [ -z "$URL" ]; then
            echo 'Could not determine workers.dev deployment URL.'
            cat deploy.log
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "SITE_URL=$URL" >> "$GITHUB_ENV"

      - name: Smoke test deployed site API and Access
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            HEALTH=$(curl --fail --silent --show-error "$SITE_URL/api/health" || true)
            if printf '%s' "$HEALTH" | grep -q '"ok":true' && printf '%s' "$HEALTH" | grep -q '"service":"6006-api"'; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo 'Health check failed.'
              printf '%s\n' "$HEALTH"
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent --show-error "$SITE_URL/" | grep -qi '<div id="root"'
          curl --fail --silent --show-error -H 'Sec-Fetch-Mode: navigate' "$SITE_URL/fehlercodes/P0299" | grep -qi '<div id="root"'

          CHAT_CODE=$(curl --silent --show-error -o /tmp/6006-chat-smoke.json -w '%{http_code}' "$SITE_URL/api/chat/deploy-smoke-missing")
          test "$CHAT_CODE" = '404'
          grep -q 'conversation_not_found' /tmp/6006-chat-smoke.json

          ADMIN_CODE=$(curl --silent --show-error -o /tmp/6006-admin-smoke.html -w '%{http_code}' "$SITE_URL/admin")
          case "$ADMIN_CODE" in
            302|303|307|308|401|403) ;;
            *) echo "Admin Access protection missing; status=$ADMIN_CODE"; exit 1 ;;
          esac

          ADMIN_API_CODE=$(curl --silent --show-error -o /tmp/6006-admin-api-smoke.json -w '%{http_code}' "$SITE_URL/api/admin/conversations")
          case "$ADMIN_API_CODE" in
            302|303|307|308|401|403) ;;
            *) echo "Admin API Access protection missing; status=$ADMIN_API_CODE"; exit 1 ;;
          esac

          echo "6006 deployed: $SITE_URL"
          echo "6006 admin protected by Access for: $ADMIN_EMAIL"

      - name: Deployment summary
        shell: bash
        run: |
          {
            echo '## 6006 Performance Cloudflare deployment'
            echo
            echo "- Site: $SITE_URL"
            echo "- Health: $SITE_URL/api/health"
            echo "- Admin: $SITE_URL/admin (Cloudflare Access protected)"
            echo "- Admin email: $ADMIN_EMAIL"
            echo "- D1: $DB_NAME (EU jurisdiction when newly created)"
            echo '- Runtime: one Cloudflare Worker serving React SPA + /api/*'
          } >> "$GITHUB_STEP_SUMMARY"
