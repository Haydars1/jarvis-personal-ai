name: One-time ECU production rollout
# verified rollout after acceptance pass
on:
  push:
    branches: [feature/learning-engine]
    paths: [.github/workflows/one-time-ecu-production-rollout.yml]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm install --no-audit --no-fund
      - name: Full acceptance
        run: npm run check
      - name: Cloudflare dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry
      - name: Preflight production resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler r2 bucket list > /tmp/r2.txt
          grep -q "jarvis-ecu-artifacts" /tmp/r2.txt
      - name: Apply additive D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute jarvis-db --remote --file=./schema.sql
          npx wrangler d1 migrations apply jarvis-db --remote
      - name: Deploy verified ECU backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Production health smoke
        id: health
        continue-on-error: true
        env:
          HEALTH_URL: ${{ secrets.JARVIS_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$HEALTH_URL"
          BASE_URL="${HEALTH_URL%/}"; BASE_URL="${BASE_URL%/api/health}"; BASE_URL="${BASE_URL%/health}"
          for i in 1 2 3; do
            BODY=$(curl --fail --silent --show-error --max-time 35 -H 'content-type: application/json' -d '{"text":"Merhaba. Sadece TAMAM yaz."}' "$BASE_URL/api/chat/send" || true)
            if node -e 'const p=JSON.parse(process.argv[1]); const r=String(p.reply||"").trim(); if(!r || r.startsWith("JARVIS şu an yanıt üretemedi")) process.exit(1)' "$BODY"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Roll back failed deployment
        if: steps.health.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler rollback --message "Automatic rollback: ECU rollout smoke failed"
          exit 1
