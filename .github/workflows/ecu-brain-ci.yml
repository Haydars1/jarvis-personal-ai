name: ECU Brain CI

on:
  push:
    branches: [feature/ecu-brain]
    paths:
      - 'src/application/ecu/**'
      - 'src/infrastructure/ecu/**'
      - 'compute/**'
      - 'tests/ecu-*.test.js'
      - 'tests/architecture.test.js'
      - 'migrations/**'
      - 'src/app-entry.js'
      - 'public/app.css'
      - 'public/index.html'
      - 'public/app.js'
      - '.github/workflows/ecu-brain-ci.yml'
      - '.github/workflows/deploy-cloudflare.yml'
      - 'schema-ecu.sql'
      - 'wrangler.jsonc'
  pull_request:
    paths:
      - 'src/application/ecu/**'
      - 'src/infrastructure/ecu/**'
      - 'compute/**'
      - 'tests/ecu-*.test.js'
      - 'tests/architecture.test.js'
      - 'migrations/**'
      - 'src/app-entry.js'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install JARVIS dependencies
        run: npm install --no-audit --no-fund
      - name: Run JARVIS checks
        run: npm run check
      - name: Validate ECU SQLite migrations
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path

          db = sqlite3.connect(':memory:')
          for path in [
              Path('migrations/0010_ecu_brain_core.sql'),
              Path('migrations/0011_ecu_brain_learning_release.sql'),
          ]:
              db.executescript(path.read_text())

          required_tables = {
              'ecu_files','ecu_jobs','ecu_analysis_results','ecu_map_candidates',
              'ecu_training_examples','ecu_change_evidence','ecu_rulepack_versions',
              'ecu_mod_artifacts','ecu_model_versions'
          }
          tables = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = required_tables - tables
          assert not missing, f'missing ECU tables: {sorted(missing)}'

          job_columns = {row[1] for row in db.execute("PRAGMA table_info(ecu_jobs)")}
          assert 'rulepack_version' in job_columns
          file_columns = {row[1] for row in db.execute("PRAGMA table_info(ecu_files)")}
          assert {'artifact_uri','immutable'} <= file_columns
          evidence_columns = {row[1] for row in db.execute("PRAGMA table_info(ecu_change_evidence)")}
          assert 'delta_stats_json' in evidence_columns

          # The deployment schema must independently produce the same runtime-critical shape.
          fresh = sqlite3.connect(':memory:')
          fresh.executescript(Path('schema-ecu.sql').read_text())
          fresh_tables = {row[0] for row in fresh.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert required_tables <= fresh_tables
          fresh_jobs = {row[1] for row in fresh.execute("PRAGMA table_info(ecu_jobs)")}
          assert 'rulepack_version' in fresh_jobs
          fresh_files = {row[1] for row in fresh.execute("PRAGMA table_info(ecu_files)")}
          assert {'artifact_uri','immutable'} <= fresh_files
          PY
      - name: Validate Cloudflare dry-run bundle
        run: npx wrangler deploy --dry-run --outdir=/tmp/jarvis-ecu-dryrun
      - name: Install ECU compute worker
        run: python -m pip install -e './compute[dev]'
      - name: Run ECU compute tests
        run: pytest -q compute/tests
      - name: Build ECU compute container
        run: docker build -f compute/Dockerfile compute
