name: ECU Brain Integration CI
on:
  push:
    branches: [feature/learning-engine]
    paths:
      - 'src/application/ecu/**'
      - 'src/infrastructure/ecu/**'
      - 'compute/**'
      - 'tests/ecu-*.test.js'
      - 'migrations/**'
      - 'src/app-entry.js'
      - 'src/worker.js'
      - 'schema.sql'
      - 'wrangler.jsonc'
      - 'package.json'
      - '.github/workflows/ecu-brain-ci.yml'
  pull_request:
    paths:
      - 'src/application/ecu/**'
      - 'src/infrastructure/ecu/**'
      - 'compute/**'
      - 'tests/ecu-*.test.js'
      - 'migrations/**'
      - 'src/app-entry.js'
      - 'src/worker.js'
      - 'schema.sql'
      - 'wrangler.jsonc'
      - 'package.json'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - name: Validate ECU migrations
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db=sqlite3.connect(':memory:')
          paths=sorted(Path('migrations').glob('001[0-9]_ecu_*.sql'))
          assert paths, 'ECU migrations not found'
          for path in paths:
              db.executescript(path.read_text())
          required={'ecu_files','ecu_jobs','ecu_analysis_results','ecu_map_candidates','ecu_training_examples','ecu_change_evidence','ecu_rulepack_versions','ecu_mod_artifacts','ecu_model_versions','ecu_workers'}
          tables={row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          assert required <= tables, sorted(required-tables)
          def columns(table):
              return {row[1] for row in db.execute(f"PRAGMA table_info({table})")}
          assert {'source_kind','trust_score'} <= columns('ecu_knowledge_sources')
          assert {'ecu_family','hw','sw'} <= columns('ecu_training_pairs')
          assert {'ecu_family','hw','sw'} <= columns('ecu_change_evidence')
          assert {'ecu_family','hw','sw'} <= columns('ecu_rulepack_versions')
          PY
      - run: python -m pip install -e './compute[dev]'
      - run: pytest -q compute/tests
      - name: Cloudflare dry run without container rollout
        run: npx wrangler deploy --dry-run --containers-rollout=none --outdir .wrangler-dry
