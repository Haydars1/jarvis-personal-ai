name: Video Skill Intake Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    if: startsWith(github.head_ref, 'video-skill-intake-')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax and unit tests
        run: npm run check
      - name: Offline Worker HTTP smoke checks
        run: npm run test:integration
      - name: Cloudflare build check only
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry
